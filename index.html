<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5 Trend Master - 53 Pary</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border: #334155;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border-bottom: 4px solid var(--accent-green);
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.9em;
            color: var(--text-dim);
        }

        .active-count {
            color: var(--accent-green);
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        th {
            background-color: #0f172a;
            padding: 15px;
            color: var(--text-dim);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            transition: all 0.2s;
        }

        /* Stan wizualny dla aktywnych sygnałów */
        .row-buy {
            background-color: rgba(16, 185, 129, 0.15) !important;
            color: var(--accent-green) !important;
            font-weight: 600;
        }

        .row-sell {
            background-color: rgba(239, 68, 68, 0.15) !important;
            color: var(--accent-red) !important;
            font-weight: 600;
        }

        .timer-badge {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #000;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            display: inline-block;
            min-width: 50px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background-color: #475569;
        }

        .dot-buy { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .dot-sell { background-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }

        .no-signal { color: var(--text-dim); opacity: 0.5; }

        tr:hover { background-color: rgba(255,255,255,0.02); }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0;">M5 STRATEGY MONITOR</h1>
    <div class="stats-bar">
        <span>Monitorowane pary: <strong>53</strong></span>
        <span>Aktywne sygnały (Sticky): <span id="activeCount" class="active-count">0</span></span>
    </div>
</div>

<table id="mainTable">
    <thead>
        <tr>
            <th>Para Walutowa / Aktywo</th>
            <th>Sygnał (3x Strong)</th>
            <th>Pozostały Czas (Sticky)</th>
            <th>Rekomendacja Działania</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
    const HOLD_TIME = 300; // 5 minut w sekundach
    let stickySignals = {}; // Pamięć aktywnych trendów

    // PEŁNA LISTA 53 PAR (Forex, OTC, Surowce, Krypto)
    const allPairs = [
        "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CHF", "USD/CAD", "NZD/USD", "EUR/GBP", 
        "EUR/JPY", "GBP/JPY", "AUD/JPY", "EUR/AUD", "EUR/CAD", "GBP/AUD", "GBP/CAD", "AUD/CAD", 
        "NZD/JPY", "CAD/JPY", "CHF/JPY", "GBP/CHF", "EUR/CHF", "AUD/NZD", "NZD/CAD", "NZD/CHF", 
        "GBP/NZD", "EUR/NZD", "AUD/CHF", "CAD/CHF", "EUR/USD_otc", "GBP/USD_otc", "USD/JPY_otc", 
        "USD/CHF_otc", "EUR/JPY_otc", "GBP/JPY_otc", "GOLD", "SILVER", "BRENT", "WTI", "PLATINUM", 
        "COPPER", "NATURAL_GAS", "BTC/USD", "ETH/USD", "LTC/USD", "XRP/USD", "EOS/USD", "TRX/USD", 
        "DOT/USD", "SOL/USD", "ADA/USD", "LINK/USD", "BCH/USD", "XLM/USD"
    ];

    // Inicjalizacja tabeli - tworzy 53 wiersze
    function initTable() {
        const tbody = document.getElementById('tableBody');
        allPairs.sort().forEach(pair => {
            const row = document.createElement('tr');
            row.id = `row-${pair.replace(/[^a-zA-Z0-9]/g, '')}`;
            row.innerHTML = `
                <td style="font-weight:bold;">${pair}</td>
                <td class="sig-cell no-signal">---</td>
                <td><span class="timer-badge no-signal">00:00</span></td>
                <td class="rec-cell no-signal">Oczekiwanie...</td>
            `;
            tbody.appendChild(row);
        });
    }

    // GŁÓWNA LOGIKA SKANOWANIA
    async function updateScanner() {
        const now = Math.floor(Date.now() / 1000);

        // --- MIEJSCE NA TWOJE DANE ---
        // Tutaj podepniesz funkcję fetch(), która pobiera dane z Twojego API
        // Poniżej symulacja trafienia sygnału dla demonstracji:
        const mockHits = [
            { p: "EUR/USD", type: "BUY" },
            { p: "GOLD", type: "SELL" },
            { p: "BTC/USD", type: "BUY" }
        ];

        mockHits.forEach(hit => {
            // "ZAMRAŻANIE" sygnału na 5 minut (Sticky Signal)
            stickySignals[hit.p] = {
                expiry: now + HOLD_TIME,
                type: hit.type
            };
        });

        render();
    }

    function render() {
        const now = Math.floor(Date.now() / 1000);
        let activeCounter = 0;

        allPairs.forEach(pair => {
            const row = document.getElementById(`row-${pair.replace(/[^a-zA-Z0-9]/g, '')}`);
            const sigCell = row.querySelector('.sig-cell');
            const timerBadge = row.querySelector('.timer-badge');
            const recCell = row.querySelector('.rec-cell');
            
            const data = stickySignals[pair];

            if (data && data.expiry > now) {
                activeCounter++;
                const timeLeft = data.expiry - now;
                const m = Math.floor(timeLeft / 60);
                const s = timeLeft % 60;

                row.className = data.type === 'BUY' ? 'row-buy' : 'row-sell';
                sigCell.innerHTML = `<span class="status-dot ${data.type === 'BUY' ? 'dot-buy' : 'dot-sell'}"></span>3x STRONG ${data.type}`;
                timerBadge.innerText = `${m}:${s.toString().padStart(2, '0')}`;
                timerBadge.classList.remove('no-signal');
                recCell.innerText = data.type === 'BUY' ? 'OTWÓRZ CALL (GÓRA)' : 'OTWÓRZ PUT (DÓŁ)';
            } else {
                // Resetowanie wiersza po wygaśnięciu sygnału
                row.className = '';
                sigCell.innerText = 'BRAK TRENDU';
                sigCell.className = 'sig-cell no-signal';
                timerBadge.innerText = '00:00';
                timerBadge.classList.add('no-signal');
                recCell.innerText = 'Skanowanie...';
                recCell.className = 'rec-cell no-signal';
                if(data) delete stickySignals[pair];
            }
        });

        document.getElementById('activeCount').innerText = activeCounter;
    }

    // Start systemu
    initTable();
    setInterval(updateScanner, 5000); // Pobieraj nowe sygnały co 5 sekund
    setInterval(render, 1000);       // Odświeżaj liczniki co sekundę
</script>

</body>
</html>
