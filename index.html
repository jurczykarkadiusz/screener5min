    <style>
        <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>M5 Sniper - Dynamic Queue</title>
    <style>
        body { background: #0b0e14; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        
        .card { 
            background: #151921; 
            padding: 15px; 
            border-radius: 10px; 
            border-left: 5px solid #333;
            transition: transform 0.2s ease; /* Płynne przeskakiwanie */
        }

        .active-buy { border-left-color: #00ff88; }
        .active-sell { border-left-color: #ff3366; }
        
        .pair { font-size: 1.1em; font-weight: bold; }
        .status-buy { color: #00ff88; font-size: 0.85em; font-weight: bold; }
        .status-sell { color: #ff3366; font-size: 0.85em; font-weight: bold; }
        
        .timer-val { 
            font-family: monospace; 
            font-size: 1.3em; 
            color: #ffffff; 
            background: #000; 
            padding: 2px 6px; 
            border-radius: 4px;
            display: inline-block;
            margin-top: 8px;
        }
        
        #empty-msg { text-align: center; color: #334155; margin-top: 100px; font-size: 1.1em; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="empty-msg">CZEKAM NA SYGNAŁ M5...</div>
    <div id="scanner" class="grid"></div>

    <script>
        const HOLD_TIME = 300;
        let lockedSignals = {};

        const allPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CHF", "USD/CAD", "EUR/JPY", "GBP/JPY", "GOLD"
        ];

        async function updateScanner() {
            const now = Math.floor(Date.now() / 1000);
            const container = document.getElementById('scanner');

            allPairs.forEach(pair => {
                // SYMULACJA ODCZYTU (3x STRONG)
                let isTripleStrong = Math.random() > 0.98; 
                let direction = Math.random() > 0.5 ? "BUY" : "SELL"; 

                if (isTripleStrong) {
                    const id = `c-${pair.replace(/[^a-zA-Z]/g, '')}`;
                    let card = document.getElementById(id);

                    if (!card) {
                        // Jeśli nie ma - stwórz nową
                        addCardToDOM(pair, direction, id);
                    } else {
                        // JEŚLI JUŻ JEST - przenieś na koniec kolejki (na dół)
                        container.appendChild(card);
                        // Zaktualizuj typ jeśli się zmienił (np. z BUY na SELL)
                        card.className = `card ${direction === 'BUY' ? 'active-buy' : 'active-sell'}`;
                    }

                    // Odśwież czas do pełnych 5 minut
                    lockedSignals[pair] = { expiry: now + HOLD_TIME, type: direction };
                }
            });
        }

        function addCardToDOM(pair, type, id) {
            const container = document.getElementById('scanner');
            document.getElementById('empty-msg').classList.add('hidden');

            const div = document.createElement('div');
            div.id = id;
            div.className = `card ${type === 'BUY' ? 'active-buy' : 'active-sell'}`;
            div.innerHTML = `
                <div class="pair">${pair}</div>
                <div class="status-label ${type === 'BUY' ? 'status-buy' : 'status-sell'}">3x STRONG ${type}</div>
                <div class="timer-val">05:00</div>
            `;
            container.appendChild(div);
        }

        function updateTimers() {
            const now = Math.floor(Date.now() / 1000);
            let activeFound = false;

            for (const pair in lockedSignals) {
                const data = lockedSignals[pair];
                const timeLeft = data.expiry - now;
                const id = `c-${pair.replace(/[^a-zA-Z]/g, '')}`;
                const card = document.getElementById(id);

                if (timeLeft > 0) {
                    activeFound = true;
                    if (card) {
                        const m = Math.floor(timeLeft / 60);
                        const s = timeLeft % 60;
                        const timeStr = `${m}:${s < 10 ? '0'+s : s}`;
                        
                        const timerElement = card.querySelector('.timer-val');
                        if (timerElement.innerText !== timeStr) {
                            timerElement.innerText = timeStr;
                        }
                    }
                } else {
                    if (card) card.remove();
                    delete lockedSignals[pair];
                }
            }

            if (!activeFound) {
                document.getElementById('empty-msg').classList.remove('hidden');
            }
        }

        setInterval(updateScanner, 3000); 
        setInterval(updateTimers, 500);   
    </script>
</body>
</html>
