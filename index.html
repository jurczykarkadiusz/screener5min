<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>M5 Sniper - Stabilny Widok</title>
    <style>
        body { background: #0e121a; color: white; font-family: 'Segoe UI', sans-serif; overflow-y: scroll; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; padding: 20px; }
        
        .card { 
            background: #1c222d; 
            padding: 15px; 
            border-radius: 8px; 
            border-left: 5px solid #333; 
            transition: opacity 0.3s, transform 0.3s;
            position: relative;
        }

        .card.active-buy { border-left-color: #00ff88; }
        .card.active-sell { border-left-color: #ff3366; }
        
        .pair { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
        .status { font-size: 0.9em; font-weight: bold; text-transform: uppercase; }
        .status-buy { color: #00ff88; }
        .status-sell { color: #ff3366; }
        
        .timer-wrapper { margin-top: 10px; color: #888; font-size: 0.85em; }
        .timer-val { font-family: monospace; color: white; font-size: 1.1em; font-weight: bold; }
        
        #empty-msg { text-align: center; color: #444; margin-top: 50px; font-size: 1.2em; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h2 style="text-align: center;">M5 SNIPER: TRYB STABILNY</h2>
    <div id="empty-msg">Czekam na sygnał 3x STRONG na M5...</div>
    <div id="scanner" class="grid"></div>

    <script>
        const HOLD_TIME = 300;
        let lockedSignals = {};

        // TWOJA LISTA PAR (Tylko te kluczowe)
        const allPairs = [
            "EUR/USD", "GBP/USD", "USD/JPY", "AUD/USD", "USD/CHF", "USD/CAD", "EUR/JPY", "GBP/JPY", "GOLD"
        ];

        async function updateScanner() {
            const now = Math.floor(Date.now() / 1000);

            allPairs.forEach(pair => {
                // SYMULACJA ODCZYTU (Tutaj wstawiasz realny warunek 3x STRONG)
                let isTripleStrong = Math.random() > 0.97; 
                let direction = Math.random() > 0.5 ? "BUY" : "SELL"; 

                if (isTripleStrong) {
                    if (!lockedSignals[pair]) {
                        createCard(pair, direction, now + HOLD_TIME);
                    }
                    lockedSignals[pair] = { expiry: now + HOLD_TIME, type: direction };
                }
            });
        }

        function createCard(pair, type, expiry) {
            const container = document.getElementById('scanner');
            const msg = document.getElementById('empty-msg');
            msg.classList.add('hidden');

            const cardId = `card-${pair.replace('/', '')}`;
            if (document.getElementById(cardId)) return;

            const card = document.createElement('div');
            card.id = cardId;
            card.className = `card ${type === 'BUY' ? 'active-buy' : 'active-sell'}`;
            card.innerHTML = `
                <div class="pair">${pair}</div>
                <div class="status ${type === 'BUY' ? 'status-buy' : 'status-sell'}">3x STRONG ${type}</div>
                <div class="timer-wrapper">Wygasa za: <span class="timer-val">--:--</span></div>
            `;
            container.appendChild(card);
        }

        function updateTimers() {
            const now = Math.floor(Date.now() / 1000);
            let hasAny = false;

            for (const pair in lockedSignals) {
                const data = lockedSignals[pair];
                const timeLeft = data.expiry - now;
                const cardId = `card-${pair.replace('/', '')}`;
                const card = document.getElementById(cardId);

                if (timeLeft > 0) {
                    hasAny = true;
                    if (card) {
                        const m = Math.floor(timeLeft / 60);
                        const s = timeLeft % 60;
                        card.querySelector('.timer-val').innerText = `${m}:${s.toString().padStart(2, '0')}`;
                    }
                } else {
                    if (card) card.remove();
                    delete lockedSignals[pair];
                }
            }

            if (!hasAny) {
                document.getElementById('empty-msg').classList.remove('hidden');
            }
        }

        // Interwały
        setInterval(updateScanner, 5000); // Pobieranie danych co 5s
        setInterval(updateTimers, 1000);  // Tylko aktualizacja tekstu co 1s (bez przerysowania)
    </script>
</body>
</html>
