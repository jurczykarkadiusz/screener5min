<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M5 Sniper - Tylko 3x Strong</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --green: #00ff95;
            --red: #ff3366;
            --text: #ffffff;
            --dim: #64748b;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
            margin-bottom: 20px;
            background: var(--card);
            border-radius: 15px;
            border: 1px solid #2d333f;
        }

        .stats { color: var(--green); font-weight: bold; font-size: 1.2em; }

        table {
            width: 100%;
            max-width: 900px;
            border-collapse: collapse;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #1c222d;
            padding: 15px;
            color: var(--dim);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #2d333f;
            font-size: 1.1em;
        }

        .buy-row { color: var(--green); background: rgba(0, 255, 149, 0.05); }
        .sell-row { color: var(--red); background: rgba(255, 51, 102, 0.05); }

        .timer {
            font-family: monospace;
            background: #000;
            padding: 5px 12px;
            border-radius: 5px;
            border: 1px solid #333;
            font-size: 1.2em;
        }

        .empty-msg {
            padding: 40px;
            color: var(--dim);
            font-style: italic;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 1.5em;">M5 SNIPER: TYLKO 3x STRONG</h1>
    <div style="margin-top:10px;">Monitorowanie: <span class="stats">53 PARY (W tym OTC)</span></div>
</div>

<table id="sniperTable">
    <thead>
        <tr>
            <th>Aktywo</th>
            <th>Kierunek</th>
            <th>Pozostały Czas</th>
            <th>Akcja</th>
        </tr>
    </thead>
    <tbody id="tableBody">
        </tbody>
</table>

<script>
    const HOLD_TIME = 300; // 5 minut
    let activeSignals = {};

    // Pełna lista 53 par (w tym OTC i Surowce)
    const allPairs = [
        "EUR/USD", "EUR/USD (OTC)", "GBP/USD", "GBP/USD (OTC)", "USD/JPY", "USD/JPY (OTC)",
        "AUD/USD", "AUD/USD (OTC)", "EUR/GBP", "EUR/GBP (OTC)", "EUR/JPY", "EUR/JPY (OTC)",
        "GBP/JPY", "GBP/JPY (OTC)", "USD/CHF", "USD/CHF (OTC)", "USD/CAD", "USD/CAD (OTC)",
        "AUD/JPY", "NZD/USD", "EUR/AUD", "GBP/AUD", "EUR/CAD", "GBP/CAD", "AUD/CAD",
        "CHF/JPY", "NZD/JPY", "CAD/JPY", "GBP/CHF", "EUR/CHF", "AUD/NZD", "NZD/CAD",
        "GOLD", "GOLD (OTC)", "SILVER", "SILVER (OTC)", "BRENT", "WTI", "PLATINUM",
        "BTC/USD", "ETH/USD", "LTC/USD", "XRP/USD", "SOL/USD", "ADA/USD",
        "EUR/CHF (OTC)", "GBP/CHF (OTC)", "AUD/CHF (OTC)", "NZD/CHF (OTC)",
        "CAD/CHF (OTC)", "EUR/NZD (OTC)", "GBP/NZD (OTC)", "AUD/NZD (OTC)"
    ];

    async function checkScanner() {
        const now = Math.floor(Date.now() / 1000);

        // SYMULACJA ODCZYTU (Tu podepniesz swój fetch)
        // Jeśli skaner znajdzie 3x Strong, dodaje parę do activeSignals
        const found = [
            // Przykład: { p: "EUR/USD (OTC)", type: "BUY" }
        ];

        found.forEach(hit => {
            activeSignals[hit.p] = {
                expiry: now + HOLD_TIME,
                type: hit.type
            };
        });

        render();
    }

    function render() {
        const tbody = document.getElementById('tableBody');
        const now = Math.floor(Date.now() / 1000);
        tbody.innerHTML = '';

        // Filtrujemy tylko aktywne sygnały, które nie wygasły
        const activePairs = Object.entries(activeSignals).filter(([p, data]) => data.expiry > now);

        if (activePairs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty-msg">Czekam na sygnał 3x STRONG na M5...</td></tr>`;
            return;
        }

        // Sortujemy od najświeższych
        activePairs.sort((a, b) => b[1].expiry - a[1].expiry).forEach(([pair, data]) => {
            const timeLeft = data.expiry - now;
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            const rowClass = data.type === 'BUY' ? 'buy-row' : 'sell-row';

            const row = `
                <tr class="${rowClass}">
                    <td><strong>${pair}</strong></td>
                    <td><span class="badge">3x STRONG</span> ${data.type}</td>
                    <td><span class="timer">${m}:${s.toString().padStart(2, '0')}</span></td>
                    <td><strong>OTWÓRZ ${data.type === 'BUY' ? 'GÓRA' : 'DÓŁ'}</strong></td>
                </tr>
            `;
            tbody.innerHTML += row;
        });

        // Czyszczenie pamięci
        Object.keys(activeSignals).forEach(p => {
            if (activeSignals[p].expiry <= now) delete activeSignals[p];
        });
    }

    setInterval(checkScanner, 5000); // Skanuj co 5s
    setInterval(render, 1000);      // Odświeżaj widok co 1s
</script>

</body>
</html>
