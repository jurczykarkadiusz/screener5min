<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Skaner M5 - 5min Sticky</title>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #1e1e1e; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #333; }
        th { background-color: #2c2c2c; color: #00ff88; text-transform: uppercase; letter-spacing: 1px; }
        .buy-row { background-color: rgba(0, 255, 136, 0.1); color: #00ff88; font-weight: bold; }
        .sell-row { background-color: rgba(255, 51, 102, 0.1); color: #ff3366; font-weight: bold; }
        .timer { font-family: monospace; color: #888; }
        .neutral { color: #555; }
        h1 { text-align: center; color: #00ff88; }
    </style>
</head>
<body>
    <h1>SKANER M5: STICKY SIGNALS (5 MIN)</h1>
    <table id="scannerTable">
        <thead>
            <tr>
                <th>Para Walutowa</th>
                <th>Sygnał</th>
                <th>Czas Pozostały</th>
                <th>Status Trendu</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <script>
        const HOLD_TIME = 300; // 5 minut
        let stickySignals = {}; // Pamięć: { "EUR/USD": { expiry: timestamp, type: "BUY" } }

        // Funkcja symulująca pobieranie danych (tu podepniesz swój fetch)
        async function fetchScannerData() {
            // Tu wstaw kod pobierający dane z TradingView/Twojego API
            // Zwracamy przykładowe trafienie dla testu:
            return [
                { p: "EUR/USD", osc: "STRONG BUY", sum: "STRONG BUY", ma: "STRONG BUY" },
                { p: "GBP/JPY", osc: "STRONG SELL", sum: "STRONG SELL", ma: "STRONG SELL" },
                { p: "AUD/USD", osc: "BUY", sum: "BUY", ma: "NEUTRAL" }
            ];
        }

        async function updateLogic() {
            const data = await fetchScannerData();
            const now = Math.floor(Date.now() / 1000);

            data.forEach(item => {
                const isTripleStrong = item.osc.includes("STRONG") && 
                                       item.sum.includes("STRONG") && 
                                       item.ma.includes("STRONG");

                if (isTripleStrong) {
                    const type = item.osc.includes("BUY") ? "BUY" : "SELL";
                    // Jeśli sygnał już jest, ale znowu jest 3x Strong -> odświeżamy czas do 5 min
                    stickySignals[item.p] = {
                        expiry: now + HOLD_TIME,
                        type: type
                    };
                }
            });
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const now = Math.floor(Date.now() / 1000);
            tbody.innerHTML = '';

            // Wyświetlamy tylko te pary, które mają aktywny "Sticky Signal"
            const activePairs = Object.entries(stickySignals).filter(([p, data]) => data.expiry > now);

            if (activePairs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="neutral">Brak silnych trendów M5...</td></tr>';
                return;
            }

            activePairs.sort((a, b) => b[1].expiry - a[1].expiry).forEach(([pair, data]) => {
                const timeLeft = data.expiry - now;
                const rowClass = data.type === "BUY" ? "buy-row" : "sell-row";
                
                const row = `
                    <tr class="${rowClass}">
                        <td>${pair}</td>
                        <td>3x STRONG ${data.type}</td>
                        <td class="timer">${timeLeft}s</td>
                        <td>TRZYMAJ POZYCJĘ</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Czyścimy stare sygnały z pamięci
            Object.keys(stickySignals).forEach(p => {
                if (stickySignals[p].expiry <= now) delete stickySignals[p];
            });
        }

        setInterval(updateLogic, 5000); // Pobieraj nowe dane co 5s
        setInterval(renderTable, 1000); // Odświeżaj zegary w tabeli co 1s
    </script>
</body>
</html>
